[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-early-warning"
version = "1.0.0"
description = "Penny Stock Early-Warning System: watches sub-$10 US stocks and alerts on building moves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Penny Early-Warning System" }]
dependencies = [
    "requests>=2.31",
    "cryptography>=41",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
news = ["yfinance>=0.2"]

[project.scripts]
penny = "penny.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
